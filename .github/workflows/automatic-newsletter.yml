name: Daily newsletter

on:
  schedule:
    - cron: "0 6 * * *"
      timezone: "Asia/Kolkata"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-newsletter
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      KIE_API_KEY: ${{ secrets.KIE_API_KEY }}
      GMAIL_TOKEN_JSON: ${{ secrets.GMAIL_TOKEN_JSON }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check required secrets
        run: |
          test -n "$TAVILY_API_KEY" || { echo "Missing TAVILY_API_KEY repository secret"; exit 1; }
          test -n "$KIE_API_KEY" || { echo "Missing KIE_API_KEY repository secret"; exit 1; }
          test -n "$GMAIL_TOKEN_JSON" || { echo "Missing GMAIL_TOKEN_JSON repository secret"; exit 1; }
      - name: Research and send new items
        run: python tools/auto_newsletter.py
      - name: Save duplicate-check state
        run: |
          if [ -f .local/newsletter_state.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -f .local/newsletter_state.json
            if ! git diff --cached --quiet; then
              git commit -m "Update automatic newsletter state"
              git push
            fi
          fi
